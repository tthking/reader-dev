name: Build & Push Docker to imccn/rust-reader

# 多架构策略：amd64 与 arm64 官方原生并发极速编译；
# 完成后 merge job 合成正式多架构 manifest 并推送到 Docker Hub (imccn/rust-reader)。
# 标签分配：
#   - latest 与 slim：均指向轻量精简版（约 53MB，爱快首选）
#   - full：指向包含 Camoufox 浏览器的全量版（约 960MB）

on:
  push:
    tags:
      - 'v*'
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-multiarch
  cancel-in-progress: true

env:
  DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
  DH_PASS: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD }}
  TARGET_REPO: imccn/rust-reader

jobs:
  amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR 中转
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: 构建并推送 amd64 (全量版 + 极简版)
        run: |
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          
          # 1. 编译全量版 (full-amd64)
          docker buildx build \
            --platform linux/amd64 \
            --push \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            -t "ghcr.io/$REPO_LC:full-amd64" \
            .
            
          # 2. 编译极简版 (slim-amd64)
          docker buildx build \
            --platform linux/amd64 \
            --file ./Dockerfile.slim \
            --push \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            -t "ghcr.io/$REPO_LC:slim-amd64" \
            .

  arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR 中转
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: 构建并推送 arm64 (全量版 + 极简版)
        run: |
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          
          # 1. 编译全量版 (full-arm64)
          docker buildx build \
            --platform linux/arm64 \
            --push \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            -t "ghcr.io/$REPO_LC:full-arm64" \
            .
            
          # 2. 编译极简版 (slim-arm64)
          docker buildx build \
            --platform linux/arm64 \
            --file ./Dockerfile.slim \
            --push \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            -t "ghcr.io/$REPO_LC:slim-arm64" \
            .

  merge:
    needs: [amd64, arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Setup buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: 登录 Docker Hub
        run: echo "$DH_PASS" | docker login -u "$DH_USER" --password-stdin

      - name: 合成并推送多架构清单到 Docker Hub
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          set -ex
          REPO_LC=$(echo "$GH_REPO" | tr '[:upper:]' '[:lower:]')

          # 1. 发布极简版 (同时作为 latest 和 slim，仅约 53MB)
          docker buildx imagetools create \
            -t "$TARGET_REPO:latest" \
            -t "$TARGET_REPO:slim" \
            -t "ghcr.io/$REPO_LC:latest" \
            -t "ghcr.io/$REPO_LC:slim" \
            "ghcr.io/$REPO_LC:slim-amd64" "ghcr.io/$REPO_LC:slim-arm64"

          # 2. 发布全量版 (标记为 full，约 960MB)
          docker buildx imagetools create \
            -t "$TARGET_REPO:full" \
            -t "ghcr.io/$REPO_LC:full" \
            "ghcr.io/$REPO_LC:full-amd64" "ghcr.io/$REPO_LC:full-arm64"
